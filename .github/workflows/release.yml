name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="$REF_NAME"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          fi
          case "$tag" in
            v[0-9]*) ;;
            *) printf 'invalid tag\n' >&2; exit 1 ;;
          esac
          case "$tag" in
            *[!A-Za-z0-9._-]*) printf 'invalid tag\n' >&2; exit 1 ;;
          esac
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1

      - name: Syntax
        run: for f in install.sh uninstall.sh src/*.sh scripts/*.sh tests/*.sh; do bash -n "$f"; done

      - name: Test
        run: |
          log="$(mktemp)"
          if bash tests/test.sh > "$log" 2>&1; then
            printf 'ok\n'
          else
            cat "$log"
            exit 1
          fi

      - name: Integration
        run: |
          log="$(mktemp)"
          if bash tests/integration.sh > "$log" 2>&1; then
            printf 'ok\n'
          else
            cat "$log"
            exit 1
          fi

      - name: Build
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: scripts/build-release.sh "$RELEASE_TAG" dist "$GITHUB_REPOSITORY" >/dev/null

      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/microtypo-actions-${{ steps.tag.outputs.tag }}.tar.gz
            dist/install.sh

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber >/dev/null
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG" --generate-notes >/dev/null
          fi
